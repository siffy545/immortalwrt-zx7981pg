name: Build ZX7981PG ImmortalWrt (kernel 6.6 + MBIM)

on:
  workflow_dispatch:
  push:
    branches: [openwrt-24.10-6.6]
    paths:
      - 'target/linux/mediatek/dts/mt7981b-wireless-tag-zx7981pg.dts'
      - 'target/linux/mediatek/image/filogic.mk'
      - 'defconfig/mt7981-zx7981pg-cli.config'
      - 'defconfig/mt7981-zx7981pg-ui.config'
      - 'files/etc/uci-defaults/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    strategy:
      matrix:
        include:
          - variant: cli
            name: CLI
          - variant: ui
            name: UI
      fail-fast: false

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force 2>/dev/null || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache cmake \
            cpio curl device-tree-compiler ecj fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gnutls-dev \
            gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev \
            libssl-dev libtool libyaml-dev lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip \
            python3-ply python3-docutils python3-pyelftools rsync scons \
            squashfs-tools subversion swig texinfo uglifyjs upx-ucl \
            unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure build (${{ matrix.name }})
        run: |
          cp defconfig/mt7981-zx7981pg-${{ matrix.variant }}.config .config
          make defconfig

      - name: Download packages
        run: |
          make download -j$(nproc)
          find dl -size -1024c -exec rm -f {} \;

      - name: Build firmware (${{ matrix.name }})
        run: |
          set -o pipefail
          echo "Building ZX7981PG ImmortalWrt 6.6 — ${{ matrix.name }} variant"
          make -j$(nproc) 2>&1 | tee /tmp/build.log || \
            make -j1 V=s 2>&1 | tee /tmp/build-verbose.log
          echo "=== Output images ==="
          find bin/targets/ -name "*.bin" 2>/dev/null | head -20

      - name: Upload sysupgrade image (${{ matrix.name }})
        uses: actions/upload-artifact@v4
        with:
          name: ZX7981PG-${{ matrix.name }}-sysupgrade
          path: bin/targets/mediatek/**/*zx7981pg*sysupgrade*
          if-no-files-found: warn

      - name: Upload factory image (${{ matrix.name }})
        uses: actions/upload-artifact@v4
        with:
          name: ZX7981PG-${{ matrix.name }}-factory
          path: bin/targets/mediatek/**/*zx7981pg*factory*
          if-no-files-found: warn

      - name: Upload full targets (${{ matrix.name }})
        uses: actions/upload-artifact@v4
        with:
          name: ZX7981PG-${{ matrix.name }}-all
          path: bin/targets/mediatek/
          if-no-files-found: warn

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.variant }}
          path: /tmp/build*.log
          if-no-files-found: ignore
